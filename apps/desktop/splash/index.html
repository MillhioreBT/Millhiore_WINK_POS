<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Millhiore WINK POS</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1f2430;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #12151b;
          color: #e7e9ee;
        }
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        max-width: 520px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #3b55d955;
        border-top-color: #3b55d9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        display: none;
        padding: 12px 16px;
        border-radius: 10px;
        background: #dc262622;
        color: inherit;
        line-height: 1.4;
      }
      body.failed #error {
        display: block;
      }
      body.failed .spinner,
      body.failed #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" />
      <h1 style="margin: 0; font-size: 22px">Millhiore WINK POS</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" style="margin: 0; opacity: 0.75">Iniciando la caja…</p>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const error = new URLSearchParams(location.search).get("error")
      if (error) {
        document.body.classList.add("failed")
        document.getElementById("error").textContent = `No se pudo iniciar: ${error}`
      }
    </script>
  </body>
</html>
