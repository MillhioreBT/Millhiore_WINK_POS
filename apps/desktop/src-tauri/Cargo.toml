[package]
name = "millhiore-desktop"
version = "0.1.0"
description = "Millhiore WINK POS: punto de venta para comercios venezolanos"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "millhiore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
